<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Locked</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif}
body{min-height:100vh;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 20%,rgba(120,115,245,.4),transparent 55%),#0c0f24}
.cd{width:min(360px,90vw);padding:32px 28px;text-align:center;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.ic{font-size:44px}h2{font-weight:500;font-size:1.25rem;margin:8px 0 4px}p{opacity:.7;font-size:.88rem;margin-bottom:16px;word-break:break-all}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);color:#fff;font-size:1.05rem;text-align:center;letter-spacing:.2em;outline:0}
input:focus{border-color:#b5b2ff}
button{margin-top:12px;width:100%;padding:12px;border-radius:14px;border:0;background:#7873f5;color:#fff;font-size:.95rem;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.er{min-height:1.3em;margin-top:10px;font-size:.82rem;color:#ff9d9d}
</style></head>
<body><form class="cd" id="f"><div class="ic">🔒</div><h2>Protected page</h2><p id="to"></p>
<input id="pc" type="password" autocomplete="off" spellcheck="false" placeholder="Passcode" autofocus>
<div class="er" id="er"></div><button id="go" type="submit">Unlock</button></form>
<script src="gate.js"></script></body></html>
