<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>CSM Bits Studio</title>
<link rel="stylesheet" href="glass.css">
<style>
body{padding:30px 16px 80px}
#wrap{max-width:820px;margin:0 auto}
h1{font-weight:300;font-size:2rem;margin-bottom:6px}
.sub{opacity:.7;margin-bottom:22px}
.sec{padding:22px;margin-bottom:18px}
.sec h2{font-weight:500;font-size:1.1rem;margin-bottom:14px}
.f{display:grid;grid-template-columns:230px 1fr 60px;gap:12px;align-items:center;margin:10px 0}
.f label{font-size:.9rem}
.f .v{font-size:.8rem;opacity:.7;text-align:right}
.f.chk{grid-template-columns:230px 1fr}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.presets span{width:42px;height:42px;border-radius:11px;cursor:pointer;border:2px solid rgba(255,255,255,.4)}
.sw{display:inline-block;width:36px;height:36px;border-radius:10px;vertical-align:middle;border:2px solid rgba(255,255,255,.5)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
textarea.inp{min-height:90px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;display:none;z-index:9}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}.th{width:110px;height:70px;border-radius:12px;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.4);cursor:pointer;position:relative}.th:hover{border-color:var(--accent-l)}.th b{position:absolute;top:3px;right:4px;background:rgba(0,0,0,.6);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.7rem;font-weight:400}
@media(max-width:640px){.f{grid-template-columns:1fr}.f .v{text-align:left}}
</style></head>
<body>
<div id="toast" class="glass"></div>
<div id="wrap">
  <h1>🎛 CSM Bits Studio</h1>
  <p class="sub">All customization in one place. Changes are saved and applied instantly.</p>
  <div id="app"></div>
</div>
<script src="settings.js"></script>
<script src="apply.js"></script>
<script src="fx.js"></script>
<script src="palette.js"></script>
<script src="bangla.js"></script>
<script src="options.js"></script>
</body></html>
