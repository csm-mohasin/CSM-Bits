<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="glass.css">
<style>
body{padding:12px}
.glass{padding:14px;margin-bottom:12px;border-radius:18px}
h3{margin-bottom:8px;font-weight:500;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tr{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer}
.tr:hover{background:rgba(255,255,255,.16)}.tr.act{background:rgba(255,255,255,.2);outline:1px solid var(--accent-l)}
.tr img{width:16px;height:16px;border-radius:4px;flex:none}
.tr span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem}
.tr b{opacity:.6;font-weight:400;padding:0 6px;border-radius:6px;cursor:pointer}.tr b:hover{background:rgba(255,80,80,.5);opacity:1}
.win{font-size:.72rem;opacity:.6;margin:8px 0 2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
textarea.inp{min-height:110px;resize:vertical;font-size:.88rem;line-height:1.5}
.small{font-size:.72rem;opacity:.6}
</style></head>
<body>
<div class="glass" id="fbCard"><h3>🔥 Firebase Sync <span class="small" id="ver"></span></h3>
  <input class="inp" id="fbK" placeholder="API Key (AIza…)" autocomplete="off" spellcheck="false" style="margin-bottom:6px">
  <input class="inp" id="fbP" placeholder="Project ID" autocomplete="off" spellcheck="false" style="margin-bottom:6px">
  <input class="inp" id="fbW" type="password" placeholder="Passphrase (optional, encryption)" autocomplete="new-password" style="margin-bottom:8px">
  <div class="row"><button class="btn sm pri" id="fbGo">💾 Save and Sync</button><a class="btn sm" href="firebase.html" target="_blank">Full setup guide</a></div>
  <div class="small" id="fbS" style="margin-top:6px;min-height:1.1em"></div></div>
<div class="glass"><h3 id="host">🌐</h3><button class="btn" id="site" style="width:100%"></button></div>
<div class="glass"><h3>📝 Note for this site <span class="small" id="nst"></span></h3><textarea class="inp" id="note" placeholder="Write here, auto-saves…"></textarea></div>
<div class="glass"><h3>🗂 Tab Manager <span class="small" id="tcount"></span></h3>
  <input class="inp" id="tq" placeholder="Search tabs…" style="margin-bottom:8px">
  <div class="row"><button class="btn sm" id="grp">Group by domain</button><button class="btn sm" id="dup">Close duplicates</button><button class="btn sm" id="ungrp">Ungroup</button></div>
  <div id="tabs"></div></div>
<div class="glass"><h3>🧰 Tools</h3><div class="row">
  <button class="btn sm" id="shot">📸 Full page</button>
  <button class="btn sm" id="shotv">🖼 This screen</button>
  <button class="btn sm" id="snap">📷 Snapshot</button>
  <a class="btn sm" href="options.html#fb" target="_blank">🔥 Firebase</a>
  <a class="btn sm" href="hub.html#clip" target="_blank">📋 Clipboard</a>
  <a class="btn sm" href="hub.html#snap" target="_blank">🗂 Snapshots</a>
  <a class="btn sm" href="stats.html" target="_blank">📊 Stats</a>
  <a class="btn sm" href="tools.html" target="_blank">JSON</a>
  <a class="btn sm" href="options.html" target="_blank">🎛 Studio</a></div></div>
<div class="glass"><h3>💾 Sessions <span class="small">Save current tabs as a set</span></h3>
  <div class="row"><input class="inp" id="sName" placeholder="Session name (optional)" style="flex:1"><button class="btn sm" id="sSave">Save</button></div>
  <div id="sList"></div></div>
<div class="glass" id="bmBox"><h3>🔖 Bookmarks</h3><div id="bm"></div></div>
<div class="glass" id="hsBox"><h3>🕘 History</h3><div id="hs"></div></div>
<script src="settings.js"></script>
<script src="apply.js"></script>
<script src="fx.js"></script>
<script src="bangla.js"></script>
<script src="sidepanel.js"></script>
</body></html>
